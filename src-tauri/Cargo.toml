[package]
name = "git-notes"
version = "0.2.2"
description = "Git-backed Markdown notes"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
# Tauri mobile builds link the app as a library; the binary below is a thin desktop entry point.
name = "git_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# Vendored so the same code builds on Linux, Windows and Android without system libgit2/OpenSSL.
git2 = { version = "0.21", default-features = false, features = [
  "https",
  "ssh",
  "vendored-libgit2",
  "vendored-openssl",
] }

tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.4"
# Opens attachments with the system app and web links in the browser. 2.5 is the last line
# that builds with rust-version 1.85 (2.6+ needs 1.90).
tauri-plugin-opener = "2.5"
notify = "8.2"
ignore = "0.4"
# ed25519 key generation for in-app SSH identities (OpenSSH key format).
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "getrandom", "std"] }
# Credential-store API shared by the desktop and Android keyring back ends below.
keyring-core = "1"

# Desktop-only plugins (window geometry persistence has no meaning on mobile).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.5"
# OS keyring: Secret Service (KWallet / gnome-keyring) on Linux, Credential Manager on Windows.
keyring = { version = "4", features = ["v1"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "android")'.dependencies]
# Keyring-ecosystem store backed by the Android Keystore (AES key) + SharedPreferences.
android-native-keyring-store = "1"
# Already in the tree through git2; used directly to feed the system CA certificates to
# libgit2 from memory (the vendored OpenSSL is built without stdio on Android).
libgit2-sys = "0.18"
openssl-sys = "0.9"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
