name: Release

# Pushing a `v*` tag builds every platform, signs the desktop bundles with the updater key
# and uploads everything to a *draft* GitHub release together with `latest.json`, which
# the in-app updater reads. Review the draft and publish it by hand. See docs/release.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu so the AppImage/deb run on older glibc too.
          - name: linux
            os: ubuntu-22.04
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev patchelf build-essential curl wget file

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release

      - run: pnpm install --frozen-lockfile

      - name: Build, sign and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "git-notes ${{ env.RELEASE_TAG }}"
          releaseBody: |
            See CHANGELOG.md for what changed.

            Desktop builds (Linux AppImage/deb/rpm, Windows installer) and the Android app
            (0.2.2 and later) update themselves from this release. The Android APK is attached
            below for a first install.
          releaseDraft: true
          prerelease: false
          tauriScript: pnpm tauri
          # Enables the updater artifacts (.sig files) only for releases, so a local
          # `pnpm tauri build` needs no signing key.
          args: --config src-tauri/tauri.release.conf.json
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  android:
    name: Android APK
    # The desktop job creates the draft release this job uploads to.
    needs: desktop
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Put the NDK toolchain on PATH
        run: echo "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-release

      - run: pnpm install --frozen-lockfile

      - name: Install the release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties

      - name: Build the release APK
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: pnpm tauri android build --apk --target aarch64 --target armv7 --target x86_64

      - name: Name the APK after the release
        run: |
          set -euo pipefail
          src=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          version="${RELEASE_TAG#v}"
          if [[ "$src" == *unsigned* ]]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is unsigned and cannot be installed."
            cp "$src" "git-notes_${version}_android-unsigned.apk"
          else
            cp "$src" "git-notes_${version}_android.apk"
          fi

      - name: Upload the APK to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: git-notes_*_android*.apk
          fail_on_unmatched_files: true
