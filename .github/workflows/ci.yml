name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Vendored OpenSSL + libgit2 compile from source; keep the build parallel.
  CARGO_NET_RETRY: 10

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev patchelf build-essential curl wget file

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Frontend lint, typecheck, format
        run: |
          pnpm lint
          pnpm typecheck
          pnpm format:check

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-features

  build-desktop:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            bundle-path: src-tauri/target/release/bundle
          - name: windows
            os: windows-latest
            bundle-path: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev patchelf build-essential curl wget file

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build desktop bundles
        run: pnpm tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: git-notes-${{ matrix.name }}
          path: |
            ${{ matrix.bundle-path }}/deb/*.deb
            ${{ matrix.bundle-path }}/rpm/*.rpm
            ${{ matrix.bundle-path }}/appimage/*.AppImage
            ${{ matrix.bundle-path }}/nsis/*.exe
            ${{ matrix.bundle-path }}/msi/*.msi
          if-no-files-found: error

  build-android:
    name: Build (android)
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
          link-to-sdk: true

      # The vendored OpenSSL/libgit2 C builds resolve `llvm-ar` / `llvm-ranlib` via PATH;
      # without this they fall back to `aarch64-linux-android-ranlib`, which no longer exists.
      - name: Put the NDK toolchain on PATH
        run: echo "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - run: pnpm install --frozen-lockfile

      - name: Build Android APK (debug, unsigned)
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: pnpm tauri android build --debug --apk --target aarch64 --target armv7 --target x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: git-notes-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
